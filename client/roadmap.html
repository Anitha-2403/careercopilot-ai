<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerCopilot AI | Roadmap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">CareerCopilot AI</a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
    </nav>
  </header>

  <main class="page-container">
    <h1 style="color: var(--color-navy); font-size: 28px; margin-bottom: 24px;">
      Your Roadmap: <span id="roadmap-role-name">...</span>
    </h1>

    <p id="roadmap-loading" style="color: var(--color-muted);">Generating your personalized roadmap...</p>
    <p id="roadmap-error" style="color: var(--color-danger); display: none;"></p>

    <div id="roadmap-content" style="display: none;">

      <section style="margin-bottom: 32px;">
        <h2 style="color: var(--color-navy); font-size: 18px; margin-bottom: 12px;">Core Skills</h2>
        <div id="core-skills" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
      </section>

      <section style="margin-bottom: 32px;">
        <h2 style="color: var(--color-navy); font-size: 18px; margin-bottom: 12px;">Learning Sequence</h2>
        <div id="learning-sequence" class="stack"></div>
      </section>

      <section style="margin-bottom: 32px;">
        <h2 style="color: var(--color-navy); font-size: 18px; margin-bottom: 12px;">Recommended Resources</h2>
        <div id="resources" class="grid-2col"></div>
      </section>

      <div style="text-align: center;">
        <a href="interview.html" class="btn-primary">Start Mock Interview →</a>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    CareerCopilot AI — Day 4 build
  </footer>

  <script src="script.js"></script>
</body>
</html>
